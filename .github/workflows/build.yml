name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Fetch interface font (open licence, Century Gothic style)
        run: |
          mkdir -p app/src/main/assets/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl/didactgothic
          curl -fsSL "$base/DidactGothic-Regular.ttf" -o app/src/main/assets/fonts/ui.ttf
          curl -fsSL "$base/OFL.txt" -o app/src/main/assets/fonts/OFL.txt
          ls -l app/src/main/assets/fonts
      - run: gradle testDebugUnitTest assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Logoxels.apk
          gh release create "build-${{ github.run_number }}" Logoxels.apk \
            --title "Logoxels build ${{ github.run_number }}" \
            --notes "Debug build of ${{ github.sha }}"
