name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Fetch interface font (open licence, Century Gothic style)
        run: |
          mkdir -p app/src/main/assets/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl/didactgothic
          curl -fsSL "$base/DidactGothic-Regular.ttf" -o app/src/main/assets/fonts/ui.ttf
          curl -fsSL "$base/OFL.txt" -o app/src/main/assets/fonts/OFL.txt
          ls -l app/src/main/assets/fonts
      - name: Load signing key
        env:
          KS_B64: ${{ secrets.LOGOXELS_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LOGOXELS_STORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add secrets LOGOXELS_KEYSTORE_B64 and LOGOXELS_STORE_PASS (Settings > Secrets and variables > Actions)"; exit 1
          fi
          KS_PASS=$(printf %s "$KS_PASS" | tr -d '[:space:]')
          printf %s "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "password length: ${#KS_PASS}, keystore bytes: $(stat -c %s "$RUNNER_TEMP/release.keystore")"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASS" > /dev/null || { echo "::error::Keystore will not open: the secrets do not match the file I sent (expect password length 24, keystore about 4200 bytes)"; exit 1; }
          echo "LOGOXELS_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "LOGOXELS_STORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
      - run: gradle testDebugUnitTest assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Logoxels.apk
          gh release create "build-${{ github.run_number }}" Logoxels.apk \
            --title "Logoxels build ${{ github.run_number }}" \
            --notes "Debug build of ${{ github.sha }}"
